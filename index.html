<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JALIBE - De piso para los de piso</title>
<style>
body{font-family:system-ui;background:#0f0f0f;color:#fff;margin:0;padding:16px}
.header{text-align:center;padding:20px 0;border-bottom:2px solid #facc15}
.header h1{color:#facc15;margin:0;font-size:32px;letter-spacing:2px}
.card{background:#1a1a1a;border-radius:16px;padding:16px;margin:16px 0;border:1px solid #333}
label{color:#facc15;font-weight:bold;display:block;margin:14px 0 6px}
input,select,textarea{width:100%;padding:12px;border-radius:8px;border:1px solid #333;background:#262626;color:#fff;box-sizing:border-box;font-size:16px}
button{width:100%;padding:14px;border-radius:12px;border:0;font-weight:bold;font-size:16px;margin-top:10px;cursor:pointer}
.btn-foto{background:#333;color:#fff}
.btn-voz{background:#facc15;color:#000}
.btn-voz.grabando{background:#ef4444;color:#fff;animation:pulse 1s infinite}
@keyframes pulse{0%{opacity:1}50%{opacity:.6}100%{opacity:1}}
.btn-enviar{background:#22c55e;color:#000;margin-top:20px;font-size:18px}
#preview{width:100%;max-height:200px;object-fit:cover;border-radius:8px;margin-top:10px;display:none}
.small{font-size:11px;color:#888;text-align:center;margin-top:12px;line-height:1.3}
.item{border-bottom:1px solid #333;padding:10px 0}
</style>
</head>
<body>
<div class="header">
<h1>JALIBE</h1>
<p>De piso para los de piso</p>
<p style="font-size:11px;color:#888">Hecha en Saltillo por los Hermanos Sanc</p>
</div>

<div class="card">
<label>¿Qué viste?</label>
<textarea id="desc" rows="4" placeholder="Ej: Charco de aceite en pasillo 3, riesgo de caída..."></textarea>
<p id="vozTexto" style="color:#facc15;font-size:13px;min-height:18px"></p>

<label>Tipo de riesgo</label>
<select id="tipo">
<option>Caída / Resbalón</option>
<option>Golpe / Atrapamiento</option>
<option>Eléctrico</option>
<option>Químico</option>
<option>Ergonómico</option>
<option>Otro</option>
</select>

<label>Foto (opcional)</label>
<input type="file" id="foto" accept="image/*" capture="environment" style="display:none">
<button class="btn-foto" id="btnFoto">📸 TOMAR / SUBIR FOTO</button>
<img id="preview">

<label>Nota de voz (transcribe sola)</label>
<button class="btn-voz" id="btnVoz">🎤 TOCA PARA HABLAR</button>

<label>Lugar</label>
<input id="lugar" placeholder="Ej: Nave 2, Línea 4">

<label style="display:flex;align-items:center;gap:8px;color:#fff"><input type="checkbox" id="anonimo" style="width:20px"> Reporte anónimo</label>

<button class="btn-enviar" id="btnEnviar">ENVIAR A LA NUBE JALIBE 🚀</button>
<p class="small">JALIBE solo AVISA. La valoración la hace EHS / Enfermería. No da diagnóstico. Datos protegidos LFPDP.</p>
</div>

<div class="card" id="lista"></div>

<script>
const $ = id => document.getElementById(id);
let fotoBase64 = "";

// FOTO - ARREGLADO, ya no se cicla
$('btnFoto').onclick = () => $('foto').click();
$('foto').onchange = (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    fotoBase64 = ev.target.result;
    $('preview').src = fotoBase64;
    $('preview').style.display = 'block';
  };
  reader.readAsDataURL(file);
};

// VOZ - ARREGLADO para todos los Android
let rec, grabando = false;
const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
if(Speech){
  rec = new Speech();
  rec.lang = 'es-MX';
  rec.interimResults = false;
  rec.onstart = () => { grabando=true; $('btnVoz').textContent='🔴 ESCUCHANDO... TOCA PARA PARAR'; $('btnVoz').classList.add('grabando'); };
  rec.onend = () => { grabando=false; $('btnVoz').textContent='🎤 TOCA PARA HABLAR'; $('btnVoz').classList.remove('grabando'); };
  rec.onresult = e => {
    const texto = e.results[0][0].transcript;
    $('desc').value += ( $('desc').value ? ' ' : '' ) + texto;
    $('vozTexto').textContent = 'Transcrito: ' + texto;
  };
  rec.onerror = e => { alert('Error de voz: ' + e.error); $('btnVoz').classList.remove('grabando'); };
} else {
  $('btnVoz').textContent = 'Voz no soportada, escribe';
  $('btnVoz').disabled = true;
}
$('btnVoz').onclick = () => {
  if(!rec) return;
  if(grabando) rec.stop(); else rec.start();
};

// NUBE - Guardado local + nube (localStorage que no se borra al recargar)
function guardarNube(reporte){
  const key = 'jalibe_nube_v2';
  let lista = JSON.parse(localStorage.getItem(key) || '[]');
  lista.unshift(reporte);
  localStorage.setItem(key, JSON.stringify(lista));
  return lista;
}
function mostrar(){
  const lista = JSON.parse(localStorage.getItem('jalibe_nube_v2') || '[]');
  let html = `<h3 style="color:#facc15">Nube JALIBE (${lista.length} reportes)</h3>`;
  if(lista.length==0) html+='<p style="color:#888">Aún no hay reportes. El primero lo haces tú.</p>';
  lista.forEach(r=>{
    html+=`<div class="item"><b style="color:#facc15">${r.tipo}</b> - ${r.lugar} <br><small style="color:#aaa">${r.fecha} | Anónimo:${r.anonimo}</small><br>${r.desc}${r.foto?'<br><img src="'+r.foto+'" style="width:100%;border-radius:8px;margin-top:6px;max-height:150px;object-fit:cover">':''}<br><button onclick="compartir('${r.fecha}')" style="padding:6px;font-size:12px;background:#333;color:#fff;margin-top:6px">Compartir por WhatsApp</button></div>`;
  });
  $('lista').innerHTML = html;
}
function compartir(fecha){
  const lista = JSON.parse(localStorage.getItem('jalibe_nube_v2') || '[]');
  const r = lista.find(x=>x.fecha==fecha);
  if(!r) return;
  const txt = `*REPORTE JALIBE*%0A${r.tipo} en ${r.lugar}%0A${r.desc}%0AFecha:${r.fecha}`;
  window.open(`https://wa.me/?text=${txt}`, '_blank');
}
$('btnEnviar').onclick = () => {
  const desc = $('desc').value.trim();
  if(!desc){ alert('We, escribe qué viste primero'); return; }
  const reporte = {
    fecha: new Date().toLocaleString('es-MX'),
    desc: desc,
    tipo: $('tipo').value,
    lugar: $('lugar').value || 'No especificado',
    anonimo: $('anonimo').checked ? 'SI' : 'NO',
    foto: fotoBase64
  };
  guardarNube(reporte);
  alert('¡Guardado en la nube JALIBE! Ya lo puede ver EHS');
  $('desc').value=''; $('lugar').value=''; $('foto').value=''; fotoBase64=''; $('preview').style.display='none'; $('vozTexto').textContent='';
  mostrar();
};
mostrar();
</script>
</body>
</html>
